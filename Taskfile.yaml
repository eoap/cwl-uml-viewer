version: "3"

vars:
  PUML_VERSION: '1.2026.8'
  VSIX: cwl-uml-viewer.vsix

tasks:
  update_plantml:
    cmds:
    - mkdir -p vendor
    - |
      curl --fail --location \
      https://github.com/plantuml/plantuml/releases/download/v{{.PUML_VERSION}}/plantuml-asl-{{.PUML_VERSION}}.jar \
      --output vendor/plantuml-asl-{{.PUML_VERSION}}.jar

  update_python_modules:
    cmds:
    - |
      python3 -m pip install --upgrade "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70" && \
      python3 -m pip install --upgrade \
      --only-binary=:all: \
      --target vendor/python \
      -r python/requirements.txt

  default:
    desc: Package and install the extension in the local VS Code instance
    cmds:
    - task: install

  package:
    desc: Validate the extension and produce its VSIX package
    cmds:
    - npm run package -- --out "{{.VSIX}}"

  install:
    desc: Package and install the extension for local debugging
    deps:
      - package
    cmds:
    - code --install-extension "{{.VSIX}}" --force
